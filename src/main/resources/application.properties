# Application
spring.application.name=todo

# H2 in-memory database (dev only)
spring.datasource.url=jdbc:h2:mem:tododb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console (dev only — disable in production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Validation constraints (change here, not in code)
todo.title.max-length=255
todo.description.max-length=2000

# Logging
logging.level.ee.rainer.todo=INFO
